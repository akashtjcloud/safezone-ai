<!DOCTYPE html>
<html>
<head>
  <title>SafeZone AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 32px;
    }

    .card {
      background: #1e293b;
      margin: 30px auto;
      padding: 25px;
      border-radius: 15px;
      width: 85%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    input {
      width: 90%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
      font-size: 16px;
    }

    button {
      background: #22c55e;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
    }

    .low { background: #16a34a; }
    .medium { background: #facc15; color: black; }
    .high { background: #dc2626; }

    .map {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<h1>🚦 SafeZone AI</h1>
<p>Accident Risk Prediction System</p>

<div class="card">
  <input type="text" placeholder="Enter your location">

  <button onclick="checkRisk()">Check Safety</button>

  <div id="output"></div>

  <div class="map">📍 Simulated Map-Based Risk Detection</div>
</div>

<script>
function checkRisk() {
  const risks = ["Low", "Medium", "High"];
  const random = Math.floor(Math.random() * 3);
  const risk = risks[random];

  let colorClass = "";
  let message = "";

  if (risk === "Low") {
    colorClass = "low";
    message = "Safe route available. Travel confidently.";
  } else if (risk === "Medium") {
    colorClass = "medium";
    message = "Moderate risk. Drive carefully.";
  } else {
    colorClass = "high";
    message = "High accident risk detected! Choose safer route.";
  }

  document.getElementById("output").innerHTML =
    `<div class="result ${colorClass}">
      ${risk === "Low" ? "🟢 LOW" : risk === "Medium" ? "🟡 MEDIUM" : "🔴 HIGH"} Risk Zone <br><br> ${message}
    </div>`;
}
</script>

</body>
</html>
